<div [style.backgroundColor]="note.colorHex" 
     class="p-5 rounded-xl shadow-sm relative group transition-all hover:shadow-md h-full flex flex-col justify-between border border-black/5">
  
  <p class="text-sm text-gray-800 whitespace-pre-wrap leading-relaxed">
    {{ note.text }}
  </p>
  
  <div class="mt-4 flex items-end justify-between">
    <span class="text-xs font-medium text-black/40">
      {{ note.createdAt | date:'MMM d, yyyy' }}
    </span>

    <button type="button" 
            (click)="onNoteDelete()" 
            class="opacity-0 group-hover:opacity-100 transition-opacity p-1.5 text-black/40 hover:text-red-600 hover:bg-white/40 rounded-lg">
      <app-icon name="trashbin" customClass="w-4 h-4"></app-icon>
    </button>
  </div>

</div>
