<div [style.backgroundColor]="note.colorHex" 
     (click)="onNoteClick()"
     class="p-5 rounded-xl shadow-sm relative group transition-all hover:shadow-md hover:-translate-y-1 cursor-pointer h-36 flex flex-col border border-black/5">
  
  <div class="flex-1 overflow-hidden">
    <p class="text-sm text-gray-800 whitespace-pre-wrap leading-relaxed break-words line-clamp-3">{{ note.text }}</p>
  </div>
  
  <div class="mt-auto flex items-end justify-between">
    <span class="text-xs font-medium text-black/40">
      {{ note.createdAt | date:'MMM d, yyyy' }}
    </span>

    <button type="button" 
            (click)="onNoteDelete($event)" 
            class="opacity-0 group-hover:opacity-100 transition-opacity p-1.5 text-black/40 hover:text-red-600 hover:bg-white/40 rounded-lg">
      <app-icon name="trashbin" customClass="w-4 h-4"></app-icon>
    </button>
  </div>

</div>
