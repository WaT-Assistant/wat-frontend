@if (toast$ | async; as toast) {
      @if (toast.isVisible) {
        <div class="fixed bottom-6 right-6 z-50 animate-fade-in-up">
          <div class="bg-white text-gray-900 px-4 py-3 rounded-xl shadow-lg border border-gray-200 flex items-center gap-4 min-w-[300px] justify-between">
            
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-green-50 flex items-center justify-center">
                <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div>
                <p class="text-sm font-medium">{{ toast.message }}</p>
                <p class="text-xs text-gray-500">{{ toast.subMessage }}</p>
              </div>
            </div>

            <button 
              (click)="onAction()" 
              class="text-sm font-bold text-blue-600 hover:text-blue-800 px-2 py-1 transition-colors uppercase tracking-wide">
              {{ toast.actionLabel }}
            </button>
            
          </div>
        </div>
      }
    }
