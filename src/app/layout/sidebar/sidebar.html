@if (isOpen) {
  <div class="fixed inset-0 bg-black/40 z-40 cursor-pointer" (click)="close.emit()"></div>
}

<div 
  class="fixed top-0 left-0 h-full w-72 bg-black text-white z-50 transform transition-transform duration-300 ease-in-out shadow-2xl flex flex-col -translate-x-full"
  [class.translate-x-0]="isOpen"
>
  <div class="px-6 py-5 flex items-center justify-between border-b border-gray-800">
    <span class="text-xl font-bold tracking-tight">Menu</span>
    <button (click)="close.emit()" class="p-2 text-gray-400 hover:text-white rounded-md hover:bg-gray-800 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <nav class="flex-1 px-4 py-6 flex flex-col gap-2 overflow-y-auto">
    <a routerLink="/" (click)="close.emit()" class="block px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors font-medium">Home</a>
    <a routerLink="/" (click)="close.emit()" class="block px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors font-medium">Explore Offers</a>
    <a routerLink="/dashboard" (click)="close.emit()" class="block px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors font-medium">My Dashboard</a>
    
    <!-- Interactive Map, future feature -->
     
    <!-- <div class="mt-4 pt-4 border-t border-gray-800">
      <div class="px-4 py-3 text-gray-500 font-medium flex items-center justify-between">
        Interactive Map <span class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-400">Soon</span>
      </div>
    </div> -->
  </nav>
</div>
