<div class="min-h-screen flex flex-col bg-white text-gray-900">
  
  <!-- Header -->
  <header class="border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 bg-white/90 backdrop-blur-sm z-40">
    <div class="flex items-center gap-4">
      <!-- Add Click -->
      <button (click)="toggleSidebar()" class="p-2 hover:bg-gray-100 rounded-md transition-colors focus:outline-none">
        <app-icon name="sidebar"></app-icon>
      </button>
      <button routerLink="/" class="font-heading text-xl tracking-tight">Work & Travel Board</button>
    </div>
    
    <div class="flex items-center space-x-4">
      @if(!isAuthPage) {
        @if (isLoggedIn$ | async) {
          <button 
            (click)="onLogout()" 
            class="text-sm font-medium bg-black text-white px-5 py-2.5 rounded-xl hover:bg-gray-800 transition-colors shadow-sm">
            Sign out
          </button>
          } @else {
          <a routerLink="/login" class="text-sm font-medium text-gray-700 hover:text-black transition-colors">
            Sign in
          </a>
          <a routerLink="/register" class="text-sm font-medium bg-black text-white px-5 py-2.5 rounded-xl hover:bg-gray-800 transition-colors shadow-sm">
            Register
          </a>
        }
      }
      </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow relative">
    <div class="w-full h-full">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Sidebar Overlay (Dark background) -->
    <app-sidebar [isOpen]="isSidebarOpen" (close)="toggleSidebar()"></app-sidebar>

</div>
