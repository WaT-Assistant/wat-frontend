@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 bg-opacity-50 transition-opacity">
    
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 relative">
      
      <div class="flex items-center gap-4 mb-4">
        <div class="flex-shrink-0 w-10 h-10 flex items-center justify-center bg-red-100 rounded-full">
          <app-icon name="warning"> </app-icon>
        </div>
        <h3 class="text-lg font-semibold text-gray-900">Delete Info</h3>
      </div>

      <p class="text-sm text-gray-600 mb-6 ml-14">
       Are you sure you want to completely delete this document information? All associated SEVIS, DS-160, and flight details will be permanently removed.
      </p>
      
      <div class="flex justify-end gap-3">
        <button type="button" (click)="onClose()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none transition-colors">
          Cancel
        </button>
        <button type="button" (click)="onConfirm()" class="px-4 py-2 text-sm font-medium text-white bg-red-600 border border-transparent rounded-md hover:bg-red-700 focus:outline-none transition-colors shadow-sm">
          Delete
        </button>
      </div>

    </div>
  </div>
}
