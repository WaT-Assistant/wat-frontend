@if (note) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50" (click)="onOverlayClick($event)">
    
    <div [style.backgroundColor]="note.colorHex"
         (click)="$event.stopPropagation()"
         class="rounded-xl shadow-2xl w-full max-w-2xl min-h-[300px] max-h-[80vh] p-8 relative flex flex-col border border-black/5">

      <button 
        type="button" 
        (click)="onClose()" 
        class="absolute top-4 right-4 p-2 text-black/40 hover:text-black/80 hover:bg-white/40 rounded-full transition-colors focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <div class="flex-1 mt-4 overflow-y-auto pr-2 custom-scrollbar">
        <p class="text-base text-gray-900 whitespace-pre-wrap leading-relaxed break-words">{{ note.text }}</p>
      </div>

      <div class="mt-6 pt-4 border-t border-black/10 flex justify-between items-center">
        <span class="text-sm font-medium text-black/40">{{ note.createdAt | date:'medium' }}</span>
      </div>

    </div>
  </div>
}
