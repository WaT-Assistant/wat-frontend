@if (note && editForm) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
    
    <div 
      class="relative w-full max-w-2xl rounded-xl shadow-2xl overflow-hidden transition-colors duration-300"
      [style.backgroundColor]="editForm.value.colorHex">
      
      <button 
        (click)="onClose()" 
        class="absolute top-4 right-4 p-2 text-black/40 hover:text-black/70 transition-colors z-10">
        <app-icon name="cross"></app-icon>
      </button>

      <form [formGroup]="editForm" (ngSubmit)="onSave()">
        
        <div class="p-8 pb-6 mt-4">
          <textarea
            formControlName="text"
            class="w-full h-48 bg-transparent border-none focus:ring-0 text-gray-800 text-lg placeholder-black/30 resize-none outline-none"
            placeholder="Jot down details...">
            </textarea>
        </div>

        <hr class="border-black/10 mx-8">

        <div class="flex flex-wrap items-center justify-between px-8 py-4 gap-4">
          
          <div class="text-sm text-black/40 font-medium">
            {{ note.createdAt | date:'MMM d, yyyy, h:mm:ss a' }} 
          </div>

          <div class="flex items-center gap-6 ml-auto">
            <div class="flex gap-2">
              @for (color of availableColors; track color) {
                <button 
                  type="button"
                  (click)="editForm.patchValue({ colorHex: color })"
                  [style.backgroundColor]="color"
                  class="w-6 h-6 rounded-full border border-black/10 transition-transform hover:scale-110 shadow-sm"
                  [class.ring-2]="editForm.value.colorHex === color"
                  [class.ring-black/40]="editForm.value.colorHex === color"
                  [class.ring-offset-1]="editForm.value.colorHex === color"
                  [style.ringOffsetColor]="editForm.value.colorHex">
                </button>
              }
            </div>

            <div class="flex gap-2">
              <button 
                type="button"
                (click)="onClose()"
                class="px-4 py-2 text-sm font-medium text-black/60 hover:text-black/90 hover:bg-black/5 rounded-lg transition-colors">
                Cancel
              </button>
              <button 
                type="submit"
                [disabled]="editForm.invalid"
                class="px-5 py-2 text-sm font-medium text-white bg-slate-900 rounded-lg hover:bg-slate-800 disabled:opacity-50 transition-colors shadow-md">
                Save
              </button>
            </div>
          </div>

        </div>
      </form>

    </div>
  </div>
}
