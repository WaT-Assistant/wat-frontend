<div class="mx-12 flex flex-col">
  
  <h2 class="text-2xl font-bold text-gray-900 mb-6 pb-5">Trip Notes</h2>

  <form [formGroup]="noteForm" (ngSubmit)="addNote()" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 relative">
    
    <textarea 
      formControlName="text" 
      rows="3" 
      placeholder="Jot down interview details, housing links, or quick thoughts..."
      class="w-full text-sm text-gray-800 placeholder-gray-400 border-none focus:ring-0 resize-none outline-none"
    ></textarea>
    
    <div class="flex items-center justify-between mt-2 pt-3 border-t border-gray-50">
      
      <div class="flex gap-2">
        @for (color of availableColors; track color) {
          <button type="button" 
                  (click)="selectColor(color)"
                  [style.backgroundColor]="color"
                  class="w-5 h-5 rounded-full transition-transform hover:scale-110 border-2"
                  [class.border-gray-800]="selectedColor === color"
                  [class.border-transparent]="selectedColor !== color">
          </button>
        }
      </div>

      <button type="submit" 
              [disabled]="noteForm.invalid"
              class="px-4 py-1.5 text-xs font-medium text-white bg-slate-900 hover:bg-slate-800 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        Add Note
      </button>

    </div>
  </form>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 overflow-y-auto pr-1 pb-4">
    @for (note of notes$ | async; track note.id) {
      
      <app-note 
        [note]="note" 
        (delete)="deleteNote($event)"
        (edit)="editNote($event)">
      </app-note>

    }
    @empty {
      <div class="col-span-full flex flex-col items-center justify-center py-12 text-gray-400">
        <svg class="w-12 h-12 mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        <p class="text-sm font-medium">Your board is empty</p>
        <p class="text-xs mt-1">Create your first sticky note above.</p>
      </div>
    }
  </div>

</div>
