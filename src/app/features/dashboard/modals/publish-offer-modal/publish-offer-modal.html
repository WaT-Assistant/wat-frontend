@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl">
      <div class="mb-2 flex items-start justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold text-gray-900">Publish Offer</h2>
          <p class="mt-2 text-sm text-gray-500">
            Share your experience at <strong>{{ offer()?.employer }}</strong> with other students.
          </p>
        </div>
        <button type="button" (click)="onClose()" class="text-gray-400 transition-colors hover:text-gray-600" aria-label="Close publish modal">
          <app-icon name="close" customClass="w-5 h-5"></app-icon>
        </button>
      </div>

      <form [formGroup]="publishForm" (ngSubmit)="onPublish()" class="mt-6">
        <div class="mb-4">
          <label class="mb-2 block text-sm font-medium text-gray-700">Rating</label>
          <div class="flex gap-1">
            @for (star of stars; track star) {
              <button
                type="button"
                (click)="setRating(star)"
                class="text-left transition-colors"
                [class.text-yellow-400]="star <= (publishForm.get('rating')?.value || 0)"
                [class.text-gray-200]="star > (publishForm.get('rating')?.value || 0)"
                [attr.aria-label]="'Set rating to ' + star">
                <app-icon name="star" customClass="w-8 h-8"></app-icon>
              </button>
            }
          </div>
        </div>

        <div class="mb-6">
          <label class="mb-2 block text-sm font-medium text-gray-700">Your Feedback</label>
          <textarea
            formControlName="feedback"
            rows="4"
            class="w-full resize-none rounded-lg border border-gray-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
            placeholder="Share your thoughts with fellow students...">
            </textarea>
        </div>

        <div class="flex justify-end gap-3">
          <button
            type="button"
            (click)="onClose()"
            class="rounded-lg px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100"
            [disabled]="isLoading()">
            Cancel
          </button>
          <button
            type="submit"
            class="rounded-lg bg-black px-4 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-gray-900 disabled:cursor-not-allowed disabled:bg-blue-400"
            [disabled]="isLoading() || publishForm.invalid">
            {{ isLoading() ? 'Publishing...' : 'Publish to Board' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
