@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden">
      
      <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-lg font-bold text-gray-900">
          {{ selectedOffer?.id ? 'Edit Job Offer' : 'Add New Job Offer' }}
        </h3>
        <button (click)="onClose()" class="text-gray-400 hover:text-gray-600">
          <app-icon name="close" customClass="w-5 h-5"></app-icon>
        </button>
      </div>

      <div class="p-6">
        <form [formGroup]="offerForm" (ngSubmit)="onSave()" class="flex flex-col gap-4">
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">Position</label>
              <input type="text" formControlName="position" class="mt-1 px-2 block w-full rounded-md 
              border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" 
              [class.!border-red-500]="isFieldInvalid('position')"
              [class.bg-red-50]="isFieldInvalid('position')"
              placeholder="e.g. Kitchen help">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Employer</label>
              <input type="text" formControlName="employer" class="mt-1 px-2 block w-full rounded-md 
              border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
              [class.!border-red-500]="isFieldInvalid('employer')"
              [class.bg-red-50]="isFieldInvalid('employer')"
              placeholder="e.g. Athenaneum hotel">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">Location</label>
              <input type="text" formControlName="placeOfWork" class="mt-1 px-2 block w-full rounded-md 
              border-gray-300 shadow-sm"
              [class.!border-red-500]="isFieldInvalid('placeOfWork')"
              [class.bg-red-50]="isFieldInvalid('placeOfWork')"
              placeholder="Chautauqua, NY">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Pay Per Hour</label>
              <div class="relative mt-1 rounded-md shadow-sm">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                  <span class="text-gray-500 sm:text-sm">$</span>
                </div>
                <input type="number" formControlName="payPerHour" 
                      class="block w-full rounded-md border-gray-300 pl-7 focus:border-blue-500 
                      focus:ring-blue-500" 
                      [class.!border-red-500]="isFieldInvalid('payPerHour')"
                      [class.bg-red-50]="isFieldInvalid('payPerHour')"
                      placeholder="16.00">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Year</label>
              <input type="number" formControlName="year" class="mt-1 px-2 block w-full rounded-md 
              border-gray-300 shadow-sm"
              [class.!border-red-500]="isFieldInvalid('year')"
              [class.bg-red-50]="isFieldInvalid('year')"
               placeholder="2026">
            </div>
          </div>

          <div class="p-4 mt-2 bg-gray-50 rounded-lg border border-gray-200">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" formControlName="housingProvided" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
              <span class="text-sm font-medium text-gray-900">Housing Provided</span>
            </label>

            @if (offerForm.get('housingProvided')?.value) {
              <div class="mt-3 pl-6">
                <label class="block text-sm font-medium text-gray-700">Housing Cost (per week)</label>
                <div class="relative mt-1 rounded-md shadow-sm w-1/2">
                  <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                    <span class="text-gray-500 sm:text-sm">$</span>
                  </div>
                  <input type="number" formControlName="housingCostPerWeek" class="block w-full rounded-md 
                  border-gray-300 pl-7 focus:border-blue-500 focus:ring-blue-500" 
                  [class.!border-red-500]="isFieldInvalid('housingCostPerWeek')"
                  [class.bg-red-50]="isFieldInvalid('housingCostPerWeek')"
                  placeholder="0.00">
                </div>
                <p class="text-xs text-gray-500 mt-1">Leave 0 if it's free</p>
              </div>
            }
          </div>

          <div class="flex justify-end gap-3 mt-4">
            @if (errorMessage) {
              <div class="text-red-500 text-sm font-medium mr-12">
                {{ errorMessage }}
              </div>
            }
            <button type="button" (click)="onClose()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
              Cancel
            </button>
            <button type="submit" [disabled]="isLoading" class="px-4 py-2 text-sm font-medium text-white bg-gray-900 rounded-md hover:bg-gray-800 disabled:opacity-50 transition-colors">
              {{ selectedOffer?.id ? 'Save Changes' : 'Create Offer' }}
            </button>
          </div>
          
        </form>
      </div>
    </div>
  </div>
}
