<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col h-full hover:-translate-y-1 hover:shadow-md transition-all duration-200">
  
  <div class="flex justify-between items-start mb-4 gap-4">
    <h3 class="text-lg font-semibold text-gray-900 leading-tight m-0">{{ offer.position }}</h3>
      
  </div>

  
  <div class="flex flex-col gap-3 mb-6 text-gray-600 text-sm flex-grow">
    <div class="flex items-center gap-2">
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
      </svg>
      <span>{{ offer.employer }}</span>
    </div>
    
    <div class="flex items-center gap-2">
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
      <span>{{ offer.placeOfWork }}</span>
    </div>

    <div class="flex items-center gap-4 mt-4">
      <span class="flex items-center text-sm font-medium bg-blue-50 text-blue-700 px-3 py-1 rounded-lg">
        Wage: ${{ offer.payPerHour | number:'1.2-2' }}/hr
      </span>
      
      @if (offer.housingProvided) {
        @if(offer.housingCostPerWeek){
          <span class="flex items-center text-sm font-medium bg-green-50 text-green-700 px-3 py-1 rounded-lg">
            Housing Included: ${{ offer.housingCostPerWeek }}/wk
          </span>
        }
        @else{
          <span class="flex items-center text-sm font-medium bg-green-50 text-green-700 px-3 py-1 rounded-lg">
            Housing Included: Free
          </span>
        }
      }
      @else {
      <span class="px-3 py-1 text-sm font-medium text-gray-700 bg-gray-100 rounded-full">
        No Housing
      </span>
      }
    </div>
  </div>

  <div class="mt-auto">
    <button class="w-full py-2 bg-gray-900 hover:bg-gray-800 text-white rounded-lg font-medium transition-colors">
      View Details
    </button>
  </div>
</div>
