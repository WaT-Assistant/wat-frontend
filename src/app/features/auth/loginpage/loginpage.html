<div class="flex justify-center px-6 pt-16 md:pt-12 pb-12">
  <div class="max-w-md w-full">
    
    <div class="text-center mb-10">
      <h1 class="text-3xl font-bold text-gray-900 mb-2 tracking-tight">Welcome back</h1>
      <p class="text-gray-500">Enter your details to access your dashboard</p>
    </div>

    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
      <form class="space-y-5" (ngSubmit)="onSubmit()">
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
          <input 
            type="email" 
            name="email"
            [(ngModel)]="formData.email"
            class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:border-black focus:ring-1 focus:ring-black outline-none transition-all" 
            placeholder="john@example.com">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <!-- <a href="#" class="text-sm font-medium text-gray-500 hover:text-black transition-colors">Forgot password?</a> -->
          </div>
          <div class="relative">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              name="password"
              [(ngModel)]="formData.password"
              class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:border-black focus:ring-1 focus:ring-black outline-none transition-all pr-12" 
              placeholder="••••••••">
            
            <button 
              type="button" 
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none p-1">
              
              @if (!showPassword) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.52-3.37m3.96-3.96A9.96 9.96 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 01-1.39 3.03M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" /></svg>
              }
            </button>
          </div>
        </div>

        @if (isLoading) {
          <div class="flex flex-col items-center justify-center">
            <app-icon name="loader"></app-icon>
          </div>
        }

        @if (errorMessage) {
          <div class="text-red-500 text-sm font-medium px-1">
            {{ errorMessage }}
          </div>
        }

        <div class="pt-2">
          <button type="submit" class="w-full bg-black text-white py-3 rounded-xl font-medium hover:bg-gray-800 transition-colors shadow-sm">
            Sign in
          </button>
        </div>
      </form>

      <div class="mt-8 text-center text-sm text-gray-500">
        Don't have an account? 
        <a routerLink="/register" class="font-medium text-black hover:underline cursor-pointer">Register</a>
      </div>
    </div>

  </div>
</div>
