<div class="flex items-center justify-center px-6 py-6">
  <div class="max-w-md w-full">
    
    <div class="text-center mb-10">
      <h1 class="text-3xl font-bold text-gray-900 mb-2 tracking-tight">Create an account</h1>
      <p class="text-gray-500">Join W&T Board and start your journey</p>
    </div>

    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
      <form class="space-y-5" (submit)="$event.preventDefault()">
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Full name</label>
          <input 
            type="text" 
            class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:border-black focus:ring-1 focus:ring-black outline-none transition-all" 
            placeholder="John Doe">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
          <input 
            type="email" 
            class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:border-black focus:ring-1 focus:ring-black outline-none transition-all" 
            placeholder="john@example.com">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <div class="relative">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:border-black focus:ring-1 focus:ring-black outline-none transition-all pr-12" 
              placeholder="••••••••">
            
            <button 
              type="button" 
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none p-1">
              
              @if (!showPassword) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.52-3.37m3.96-3.96A9.96 9.96 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 01-1.39 3.03M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
                </svg>
              }
            </button>
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full bg-black text-white py-3 rounded-xl font-medium hover:bg-gray-800 transition-colors shadow-sm">
            Register
          </button>
        </div>
      </form>

      <div class="mt-8 text-center text-sm text-gray-500">
        Already have an account? 
        <a routerLink="/login" class="font-medium text-black hover:underline">Sign in</a>
      </div>
    </div>

  </div>
</div>
